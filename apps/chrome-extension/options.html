<!doctype html>
<html>
<head><meta charset="utf-8"><title>driftnet</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main class="options">
    <h1 id="title"></h1>
    <label for="serverUrl" id="serverLabel"></label>
    <input id="serverUrl" type="url" placeholder="http://localhost:8787" autocomplete="off">
    <div class="hint" id="serverHint"></div>
    <label for="token" id="tokenLabel"></label>
    <input id="token" type="password" autocomplete="off">
    <button id="save" type="button"></button>
    <div id="result"></div>
    <p class="privacy" id="privacy"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
