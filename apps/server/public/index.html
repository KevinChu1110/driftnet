<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>driftnet</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f6fdb; --accent-soft: #e8effc; --warn: #b4540a; --star: #c58a00;
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1b1b1a; --text: #ececea; --muted: #9a9a94; --line: #2d2d2b;
            --accent: #7aa7ff; --accent-soft: #1e2a40; --warn: #f0a050; --star: #f2c14e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
  header { display: flex; gap: 16px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header .stats { color: var(--muted); font-size: 13px; }
  .lang { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  header input { flex: 1; min-width: 180px; max-width: 420px; margin-left: auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .layout { display: grid; grid-template-columns: 220px 1fr; max-width: 1200px; margin: 0 auto; }
  nav { padding: 16px 12px; border-right: 1px solid var(--line); position: sticky; top: 61px; align-self: start; max-height: calc(100vh - 61px); overflow: auto; }
  nav button { display: flex; justify-content: space-between; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  nav button:hover { background: var(--accent-soft); }
  nav button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 10px 6px; }
  main { padding: 16px 20px 48px; display: grid; gap: 12px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; scroll-margin-top: 80px; }
  .card:target { outline: 2px solid var(--accent); }
  .card .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .card a.name { color: var(--text); font-weight: 650; font-size: 16px; text-decoration: none; }
  .card a.name:hover { color: var(--accent); }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .worth-must-see { color: var(--star); }
  .card p { margin: 6px 0; }
  .card ul { margin: 6px 0; padding-left: 20px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  .flag { color: var(--warn); font-size: 13px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; border-right: 0; border-bottom: 1px solid var(--line); max-height: none; display: flex; overflow-x: auto; gap: 4px; padding: 8px 16px; }
    nav h2 { display: none; }
    nav button { width: auto; white-space: nowrap; gap: 6px; }
    main { padding: 12px 16px 40px; }
    header { padding: 12px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>driftnet</h1>
  <span class="stats" id="stats"></span>
  <input id="q" type="search">
  <button id="lang" class="lang" type="button"></button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Categories"></nav>
  <main id="list" aria-live="polite"></main>
</div>
<script>
  const STRINGS = {
    en: {
      title: "driftnet", search: "Search tools, tags, links…", all: "All", any: "Any",
      tokenPrompt: "This catalogue is private. Enter its token (DRIFTNET_TOKEN).", tokenSave: "Open",
      categories: "Categories", kind: "Kind", switchTo: "中文", pending: "⏳ waiting for a summary",
      enrichedBy: (a) => `summary by ${a}`,
      stats: (n, s) => `${n} items · shared ${s}×`, shared: (n) => `shared ${n}×`,
      empty: "Nothing here yet — drop a link in your chat.",
      kinds: { repo: "Repos", product: "Products", video: "Videos", article: "Articles", post: "Posts", other: "Other" },
      worth: { skip: "skip", low: "low", normal: "normal", "must-see": "★ must-see" },
      flags: { injection: "prompt injection", "hidden-chars": "hidden characters", "low-reputation": "low-reputation source" },
    },
    "zh-TW": {
      title: "driftnet", search: "搜尋工具、標籤、連結…", all: "全部", any: "不限",
      tokenPrompt: "這份清單是私人的，請輸入 token（DRIFTNET_TOKEN）。", tokenSave: "開啟",
      categories: "分類", kind: "類型", switchTo: "EN", pending: "⏳ 等待摘要",
      enrichedBy: (a) => `由 ${a} 整理`,
      stats: (n, s) => `${n} 則 · 分享 ${s} 次`, shared: (n) => `分享 ${n} 次`,
      empty: "還沒有內容，把連結丟進聊天室吧。",
      kinds: { repo: "程式庫", product: "產品", video: "影片", article: "文章", post: "貼文", other: "其他" },
      worth: { skip: "略過", low: "普通", normal: "值得看", "must-see": "★ 必看" },
      flags: { injection: "提示詞注入", "hidden-chars": "隱藏字元", "low-reputation": "低信譽來源" },
    },
  };
  const state = { category: "", kind: "", q: "" };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const safeUrl = (u) => (/^https?:\/\//.test(u) ? u : "#");
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  // Private instances need the token on every read; it stays in this browser only.
  async function api(path) {
    const token = store.get("driftnet-token");
    const res = await fetch(path, token ? { headers: { authorization: `Bearer ${token}` } } : {});
    if (res.status === 401) throw Object.assign(new Error("unauthorized"), { unauthorized: true });
    return res.json();
  }

  function askToken() {
    $("nav").innerHTML = "";
    $("list").innerHTML = `<form class="card" id="token-form">
      <p>${esc(T().tokenPrompt)}</p>
      <input id="token" type="password" autocomplete="current-password" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit">
      <p><button class="lang" type="submit">${esc(T().tokenSave)}</button></p></form>`;
    $("token-form").onsubmit = (e) => {
      e.preventDefault();
      store.set("driftnet-token", $("token").value.trim());
      load();
    };
  }

  let locale = "en";
  let catLabels = {};
  const T = () => STRINGS[locale] ?? STRINGS.en;
  const catLabel = (id) => catLabels[id]?.[locale] ?? id;

  function applyLocale() {
    document.documentElement.lang = locale;
    $("q").placeholder = T().search;
    $("q").setAttribute("aria-label", T().search);
    $("lang").textContent = T().switchTo;
  }

  async function load() {
    let stats, ui;
    try {
      [stats, ui] = await Promise.all([api("/api/stats"), api("/api/ui")]);
    } catch (err) {
      if (err.unauthorized) return askToken();
      throw err;
    }
    catLabels = ui.categories;
    // The viewer's choice wins over the server default.
    const saved = store.get("driftnet-locale");
    locale = STRINGS[saved] ? saved : STRINGS[ui.locale] ? ui.locale : "en";
    applyLocale();
    $("stats").textContent = T().stats(stats.items, stats.shares);
    const btn = (key, label, n, field) =>
      `<button data-field="${field}" data-value="${esc(key)}" aria-pressed="${state[field] === key}">
         <span>${esc(label)}</span><span class="count">${n ?? ""}</span></button>`;
    $("nav").innerHTML =
      btn("", T().all, stats.items, "category") +
      `<h2>${esc(T().categories)}</h2>` +
      Object.keys(catLabels).filter((k) => stats.byCategory[k]).map((k) => btn(k, catLabel(k), stats.byCategory[k], "category")).join("") +
      `<h2>${esc(T().kind)}</h2>` + btn("", T().any, "", "kind") +
      Object.entries(T().kinds).map(([k, v]) => btn(k, v, "", "kind")).join("");
    $("nav").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      state[b.dataset.field] = b.dataset.value;
      $("nav").querySelectorAll(`[data-field="${b.dataset.field}"]`).forEach((x) => x.setAttribute("aria-pressed", x === b));
      render();
    };
    render();
  }

  async function render() {
    const p = new URLSearchParams({ limit: "300" });
    for (const k of ["category", "kind", "q"]) if (state[k]) p.set(k, state[k]);
    const items = await api(`/api/items?${p}`);
    $("list").innerHTML = items.length ? items.map(card).join("") : `<div class="empty">${esc(T().empty)}</div>`;
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  }

  function card(i) {
    const s = i.summary;
    const url = safeUrl(s?.primaryUrl || i.url);
    return `<article class="card" id="item-${i.id}">
      <div class="top">
        <a class="name" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(s?.name ?? i.title)}</a>
        <span class="badge">${esc(catLabel(i.category))}</span>
        <span class="badge worth-${esc(i.worth)}">${esc(T().worth[i.worth] ?? i.worth)}</span>
        ${i.pending ? `<span class="badge">${esc(T().pending)}</span>` : ""}
      </div>
      ${s ? `<p>${esc(s.oneLiner)}</p>` : ""}
      ${s?.highlights?.length ? `<ul>${s.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
      ${i.flags.length ? `<div class="flag">⚠ ${esc(i.flags.map((f) => T().flags[f] ?? f).join(", "))}</div>` : ""}
      <div class="meta">
        <span>#${i.id}</span><span>${esc(T().kinds[i.kind] ?? i.kind)}</span><span>${esc(T().shared(i.shareCount))}</span>
        <span>${esc(i.createdAt.slice(0, 10))}</span>
        ${i.enrichedBy ? `<span>${esc(T().enrichedBy(i.enrichedBy.replace(/^agent:/, "")))}</span>` : ""}
        ${s?.tags?.length ? `<span>${s.tags.map((t) => "#" + esc(t)).join(" ")}</span>` : ""}
      </div>
    </article>`;
  }

  $("lang").onclick = () => {
    locale = locale === "en" ? "zh-TW" : "en";
    store.set("driftnet-locale", locale);
    load();
  };
  let t;
  $("q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => {
    state.q = e.target.value.trim();
    render();
  }, 200); };
  load();
</script>
</body>
</html>
