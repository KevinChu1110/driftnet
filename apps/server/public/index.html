<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="driftnet">
<title>driftnet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="alternate" type="application/atom+xml" title="driftnet" href="/feed.xml">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f6fdb; --accent-soft: #e8effc; --warn: #b4540a; --star: #c58a00; --star-soft: #fff4d6;
    --danger: #c62828; --danger-soft: #fde8e8; --ok: #2e7d32; --ok-soft: #e6f4ea;
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    /* Branch colours for folders (map, badges, sidebar dots). */
    --m1: oklch(52% .16 262); --m2: oklch(55% .11 185); --m3: oklch(58% .15 45); --m4: oklch(52% .17 300);
    --m5: oklch(55% .17 355); --m6: oklch(53% .13 148); --m7: oklch(60% .13 75); --m8: oklch(54% .12 225);
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121211; --panel: #1b1b1a; --text: #ececea; --muted: #9a9a94; --line: #2d2d2b;
            --accent: #7aa7ff; --accent-soft: #1e2a40; --warn: #f0a050; --star: #f2c14e; --star-soft: #3a3016;
            --danger: #ef9a9a; --danger-soft: #3b1d1d; --ok: #81c784; --ok-soft: #1d3322; color-scheme: dark;
            --m1: oklch(74% .12 262); --m2: oklch(76% .1 185); --m3: oklch(76% .12 45); --m4: oklch(74% .13 300);
            --m5: oklch(75% .13 355); --m6: oklch(76% .11 148); --m7: oklch(80% .11 75); --m8: oklch(76% .1 225);
            --shadow: 0 0 0 1px rgba(255,255,255,.06); }
  }
  :root[data-theme="dark"] { --bg: #121211; --panel: #1b1b1a; --text: #ececea; --muted: #9a9a94; --line: #2d2d2b;
            --accent: #7aa7ff; --accent-soft: #1e2a40; --warn: #f0a050; --star: #f2c14e; --star-soft: #3a3016;
            --danger: #ef9a9a; --danger-soft: #3b1d1d; --ok: #81c784; --ok-soft: #1d3322; color-scheme: dark;
            --m1: oklch(74% .12 262); --m2: oklch(76% .1 185); --m3: oklch(76% .12 45); --m4: oklch(74% .13 300);
            --m5: oklch(75% .13 355); --m6: oklch(76% .11 148); --m7: oklch(80% .11 75); --m8: oklch(76% .1 225);
            --shadow: 0 0 0 1px rgba(255,255,255,.06); }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  .ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
  .tool.on .ico, .ico.filled { fill: currentColor; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
         line-break: strict; text-wrap: pretty; }
  button { font: inherit; color: inherit; }

  header { display: flex; gap: 12px 16px; align-items: center; padding: 12px 20px; padding-top: max(12px, env(safe-area-inset-top));
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 19px; margin: 0; letter-spacing: -0.02em; font-weight: 750; }
  @media (min-width: 721px) { header { padding-inline: max(20px, calc((100vw - 1200px) / 2 + 20px)); } }
  .stats { color: var(--muted); font-size: 13px; }
  .search { flex: 1; min-width: 180px; max-width: 420px; margin-left: auto; padding: 9px 12px; border: 1px solid var(--line);
            border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; }
  .skip { position: absolute; left: 8px; top: -60px; z-index: 50; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 10px; }
  .skip:focus { top: 8px; }
  .lock { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--star); color: var(--text); background: var(--star-soft);
          border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; min-height: 40px; white-space: nowrap; }
  .lock[hidden] { display: none; }
  .lock.bump { animation: bump .7s ease 2; }
  .card.shake { animation: shake .35s ease; }
  @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(8px); } }
  @media (max-width: 720px) { .lock .long { display: none; } .lock { padding: 6px 10px; } }
  @media (min-width: 721px) { .lock .short { display: none; } }
  /* Browsing with a read-only share key: nothing that edits is offered. */
  body.readonly .tools, body.readonly .link-btn[data-act="note"], body.readonly nav .more, body.readonly nav [data-new],
  body.readonly .map-bar [data-map="new"], body.readonly #new-note, body.readonly .hint.swipe-hint { display: none !important; }
  .lang { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; min-height: 40px; }

  .layout { display: grid; grid-template-columns: 256px 1fr; max-width: 1200px; margin: 0 auto; }
  nav { padding: 16px 12px; border-right: 1px solid var(--line); position: sticky; top: 65px; align-self: start; max-height: calc(100vh - 65px); overflow: auto; }
  nav .row { display: contents; }
  nav button .lbl { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
  nav button .lbl .ico { color: var(--muted); }
  nav button[aria-pressed="true"] .lbl .ico { color: var(--accent); }
  nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  nav .dot.sub { background: none; border: 1.5px solid var(--c); width: 7px; height: 7px; }
  nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0;
               border-radius: 8px; background: none; text-align: left; cursor: pointer; }
  nav button:hover { background: var(--accent-soft); }
  nav button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav .count { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 10px 6px; }

  /* The reader's folder tree. */
  nav .folders-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 6px 10px; }
  nav .folders-head h2 { margin: 0; }
  nav .icon { width: 30px; min-width: 30px; height: 30px; padding: 0; justify-content: center; color: var(--muted); flex: none; font-size: 15px; }
  nav .icon:hover, nav .icon:focus-visible { color: var(--text); }
  nav .folder { display: flex; align-items: center; gap: 0; padding-left: calc(var(--depth) * 12px); border-radius: 8px; }
  nav .folder > [data-field] { flex: 1; min-width: 0; padding-left: 4px; }
  nav .folder > [data-field] > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .twist { transition: transform .15s ease; font-size: 10px; width: 22px; min-width: 22px; }
  nav .twist .ico, nav .more .ico { width: 15px; height: 15px; }
  nav .folder .more { width: 26px; min-width: 26px; }
  nav .twist[aria-expanded="true"] { transform: rotate(90deg); }
  nav .twist.leaf { visibility: hidden; }
  nav .folder .more { opacity: 0; }
  nav .folder:hover .more, nav .folder .more:focus-visible, nav .folder:has([aria-pressed="true"]) .more { opacity: 1; }
  @media (hover: none) { nav .folder .more { opacity: 1; } }
  nav .drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  nav .folder.dragged { opacity: .45; }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 18px;
           width: min(420px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 12px; font-size: 17px; }
  dialog label { display: grid; gap: 4px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  dialog input, dialog textarea, dialog select { font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                                                 border-radius: 10px; padding: 9px 11px; width: 100%; }
  dialog textarea { resize: vertical; }
  .dlg-actions { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .dlg-actions .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 14px; min-height: 40px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--panel); }
  .dlg-error { color: var(--danger); font-size: 13px; margin: 0 0 8px; }
  .dlg-error:empty { display: none; }
  .pick { display: grid; gap: 2px; max-height: min(60vh, 460px); overflow: auto; margin: 0 -6px 12px; }
  .pick button { display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; text-align: left; border-radius: 8px;
                 padding: 9px 10px 9px calc(10px + var(--depth) * 16px); min-height: 42px; cursor: pointer; }
  .pick button:hover, .pick button:focus-visible { background: var(--accent-soft); }
  .pick button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  .pick .count { color: var(--muted); font-weight: 400; }

  .found { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .found a { color: var(--accent); text-decoration: none; background: var(--accent-soft); border-radius: 99px; padding: 1px 9px; }
  .found a:hover { text-decoration: underline; }
  .said { margin: 8px 0 2px; padding: 6px 10px; border-left: 3px solid var(--line); color: var(--muted); font-size: 14px; white-space: pre-wrap; }
  .said, .mynote { display: flex; gap: 8px; align-items: flex-start; }
  .said .ico, .mynote .ico { margin-top: 2px; width: 16px; height: 16px; }
  .mynote { margin: 8px 0 2px; padding: 8px 10px; border-radius: 8px; background: var(--star-soft); font-size: 14px; white-space: pre-wrap; }

  .link-btn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; }
  .link-btn:hover { text-decoration: underline; }
  nav .foot { display: grid; gap: 2px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  nav .foot button { color: var(--muted); font-size: 14px; }
  .note-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left;
               font: inherit; color: inherit; width: 100%; }
  .note-card:hover { border-color: var(--accent); }
  .note-card h3 { margin: 0 0 4px; font-size: 16px; }
  .note-card .md { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .md h1, .md h2, .md h3 { font-size: 15px; margin: 8px 0 4px; }
  .md p { margin: 4px 0; }
  .md ul { margin: 4px 0; padding-left: 20px; }
  .md blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .md code { background: var(--bg); border-radius: 4px; padding: 0 4px; font-size: 13px; }
  .md pre { background: var(--bg); border-radius: 8px; padding: 8px 10px; overflow: auto; font-size: 13px; }
  .md a { color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar .spacer { flex: 1; }
  dialog.wide { width: min(720px, calc(100vw - 32px)); }
  #nd-body { min-height: 40vh; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  body.compact .card ul, body.compact .said, body.compact .card .found { display: none; }
  body.compact .card { padding-top: 10px; padding-bottom: 10px; }
  body.compact .card p { margin: 2px 0; }
  body.hide-tags .meta .tags, body.hide-said .said { display: none; }
  .set-group { border: 0; padding: 0; margin: 0 0 16px; }
  .set-group legend { font-weight: 650; font-size: 14px; margin-bottom: 8px; padding: 0; }
  .set-row { display: grid; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .set-row.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  .set-row.check input { width: 18px; height: 18px; }
  .set-row small { color: var(--muted); }
  .set-status { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-bottom: 14px; }
  .set-scroll { max-height: min(70vh, 640px); overflow: auto; margin: 0 -18px; padding: 0 18px; }
  /* The mind map: folders branch out to the right; drag cards onto folders. */
  .map-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .map-bar .btn { min-height: 40px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; }
  .map-crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin: 8px 0 0; font-size: 14px; }
  .map-crumb button { background: none; border: 0; padding: 6px 4px; min-height: 32px; color: var(--accent, inherit); font: inherit; cursor: pointer; text-decoration: underline; }
  .map-crumb [aria-current] { font-weight: 600; padding: 6px 4px; }
  .map-crumb .sep { color: var(--muted); }
  .mnode:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; }
  .map-tip { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .map-wrap { position: relative; overflow: auto; height: 70vh; min-height: 320px; border: 1px solid var(--line);
              border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); touch-action: pan-x pan-y pinch-zoom; overscroll-behavior: contain;
              background-image: radial-gradient(color-mix(in srgb, var(--muted) 18%, transparent) 1px, transparent 1px); background-size: 22px 22px; }
  .map-canvas { position: relative; transform-origin: 0 0; }
  .map-canvas > svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .map-canvas > svg path { fill: none; stroke-linecap: round; opacity: .8; }
  .map-canvas.searching > svg path:not(.hit) { opacity: .25; }
  /* The zoom pill sits on the frame's corner, not on the (scrolling) map. */
  .map-shell { position: relative; min-width: 0; width: 100%; }   /* never wider than the page, however wide the map */
  main { min-width: 0; }
  .map-zoom { position: absolute; bottom: 12px; right: 12px; display: flex; background: var(--panel);
              border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; z-index: 2; }
  .map-zoom button { width: 44px; height: 44px; border: 0; background: none; color: var(--text); cursor: pointer; display: grid; place-items: center; }
  .map-zoom button + button { border-left: 1px solid var(--line); }
  .map-zoom button:hover { background: var(--bg); }
  .mnode { position: absolute; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px;
           white-space: nowrap; font-size: 14px; cursor: pointer; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none;
           background: var(--panel); border: 2px solid var(--c); color: var(--text); box-shadow: var(--shadow);
           transition: transform .12s ease, box-shadow .12s ease, opacity .15s ease; }
  @media (pointer: fine) { .mnode { touch-action: none; } }
  .mnode:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .mnode:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mnode .ico { width: 15px; height: 15px; }
  .mnode.root { height: 46px; border-radius: 23px; padding: 0 20px; font-size: 17px; font-weight: 750; color: #fff; letter-spacing: -.01em;
                background: linear-gradient(135deg, oklch(45% .17 262), oklch(44% .1 190)); border: 0; }
  .mnode.root .cnt { background: rgba(255,255,255,.22); color: #fff; }
  .mnode.folder.l1 { background: var(--c); color: #fff; border: 0; font-weight: 650; height: 38px; }
  .mnode.folder.l1 .cnt { background: rgba(255,255,255,.25); color: #fff; }
  .mnode.folder.l1 .tw, .mnode.folder.l1 .opt { color: #fff; }
  .mnode.folder.l2 { font-weight: 600; background: color-mix(in srgb, var(--c) 14%, var(--panel)); }
  .mnode.folder.vacant { opacity: .75; border: 2px dashed var(--c); background: var(--panel); color: var(--text); }
  .mnode.folder.vacant .opt { color: var(--muted); }
  .mnode.item { height: 30px; font-size: 13px; padding: 0 4px; border: 0; border-bottom: 2px solid var(--c); border-radius: 0; background: none; box-shadow: none; }
  .mnode.item:hover { background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: 6px 6px 0 0; }
  .mnode.item .w { color: var(--star); display: inline-flex; }
  .mnode.more { height: 28px; font-size: 12.5px; border: 1px dashed var(--c); color: var(--c); background: var(--panel); box-shadow: none; }
  .mnode .cnt { font-size: 12px; color: var(--c); font-weight: 600; background: color-mix(in srgb, var(--c) 18%, var(--panel)); border-radius: 99px; padding: 0 7px; }
  .mnode .tw { display: inline-flex; color: var(--c); transition: transform .15s ease; }
  .mnode .tw.open { transform: rotate(90deg); }
  .mnode.left .tw:not(.open) { transform: rotate(180deg); }
  .mnode .opt { display: inline-flex; color: var(--muted); margin-right: -8px; padding: 6px; border-radius: 50%; }
  .mnode .opt:hover { background: rgba(0,0,0,.1); }
  .map-canvas.searching .mnode:not(.hit):not(.root):not(.l1) { opacity: .35; }
  .mnode.hit { box-shadow: 0 0 0 3px color-mix(in srgb, var(--star) 55%, transparent); opacity: 1; }
  .mnode.lift { transform: scale(1.08); box-shadow: 0 8px 22px rgba(0,0,0,.22); }
  .mnode.drop { transform: scale(1.1); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 40%, transparent); }
  .mnode.dragging { opacity: .35; }
  .mnode.picked { outline: 3px solid var(--c); outline-offset: 3px; transform: scale(1.06); }
  .pickbar { position: fixed; left: 12px; right: 12px; bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); z-index: 6; display: flex; gap: 10px;
             align-items: center; justify-content: space-between; background: var(--accent); color: #fff; border-radius: 14px; padding: 10px 10px 10px 16px;
             box-shadow: 0 8px 26px rgba(0,0,0,.28); }
  .pickbar[hidden] { display: none; }
  .pickbar button { border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 600; }
  .mnode.bump { animation: bump .6s ease; }
  @keyframes bump { 30% { transform: scale(1.14); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 35%, transparent); } }
  .map-wrap.panning { cursor: grabbing; }
  body.map-view { overflow: hidden; }
  /* On the map, messages sit at the top so they never cover the zoom buttons. */
  body.map-view .toast { bottom: auto; top: calc(env(safe-area-inset-top) + 76px); transform: translate(-50%, calc(-100% - 120px)); }
  body.map-view .toast.show { transform: translate(-50%, 0); }
  body.map-view .pickbar { bottom: auto; top: calc(env(safe-area-inset-top) + 72px); }
  .pickbar button { white-space: nowrap; }
  /* Several cards selected: a bar at the bottom (top on the map) with what can be done to all of them. */
  .swipe.selected .card { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
  .swipe.selected .card::after { content: "✓"; position: absolute; left: -1px; top: -1px; width: 22px; height: 22px; border-radius: 12px 0 10px 0; background: var(--accent);
                                 color: #fff; font-size: 13px; display: grid; place-items: center; }
  .mnode.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
  .selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, calc(env(safe-area-inset-bottom) + 8px)); z-index: 6; display: flex; flex-wrap: wrap;
            gap: 6px; align-items: center; background: var(--accent); color: #fff; border-radius: 14px; padding: 8px 8px 8px 16px; box-shadow: 0 8px 26px rgba(0,0,0,.28);
            width: max-content; max-width: calc(100vw - 24px); }
  .selbar[hidden], body.readonly .selbar { display: none !important; }
  .selbar .sel-n { font-weight: 650; margin-right: 6px; }
  .selbar button { border: 0; background: rgba(255,255,255,.2); color: #fff; border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 600; white-space: nowrap;
                   display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .selbar button:hover, .selbar button:focus-visible { background: rgba(255,255,255,.34); }
  .selbar .ico { width: 16px; height: 16px; }
  body.selecting main { padding-bottom: 120px; }
  body.selecting .toast { bottom: calc(max(16px, env(safe-area-inset-bottom) + 8px) + 72px); }
  body.map-view .selbar { bottom: auto; top: calc(env(safe-area-inset-top) + 72px); }

          DRIFTNET_SUMMARY_DEPTH: { "": "標準（預設）", brief: "簡短：一句話、2 個重點、看得到什麼", standard: "標準", detailed: "詳細：更多重點、使用情境、怎麼試用" },
          DRIFTNET_LOCALE: { "": "跟摘要一樣", en: "English", "zh-TW": "繁體中文" },
          DRIFTNET_REPLY: { "": "一行＋連結（預設）", link: "一行＋連結", full: "完整摘要", off: "不回覆" },

  };
  const state = { view: "all", category: "", kind: "", q: "" };
  /** While a pane renders (split view), $("list") means that pane, so the list and map renderers can share the page unchanged. */
  let paneFor = null, paneLock = Promise.resolve();
  const $ = (id) => (paneFor && id === "list" ? paneFor : document.getElementById(id));
  function inPane(pane, fn) {
    const go = async () => { paneFor = pane; try { return await fn(); } finally { paneFor = null; } };
    return (paneLock = paneLock.catch(() => {}).then(go));
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const safeUrl = (u) => (/^https?:\/\//.test(u) ? u : "#");
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  /** Split view: the saved choice; it only shows on wide screens, and only beside the card views. */
  let split = store.get("driftnet-split") === "1";
  const wideQuery = matchMedia("(min-width: 1200px)");
  const splitOn = () => split && wideQuery.matches && (state.view === "all" || state.view === "favorites");
  const mapShown = () => state.view === "map" || splitOn();

  let locale = "en";
  let catLabels = {};
  let folders = [];
  let notes = [];
  /** admin: may change things; reader: browsing with a share key (see /api/ui). */
  let role = "admin";
  let serverPort = 8787;
  let summaries = true;
  /** Something needs the password: ask in a dialog that checks it, and keep whatever the user was doing. */
  function needAdmin() {
    toast(T().needPassword);
    openLogin();
  }
  let items = [];
  // Folders the reader closed in the tree; remembered in this browser.
  const collapsed = new Set((() => { try { return JSON.parse(store.get("driftnet-collapsed") ?? "[]"); } catch { return []; } })());
  const kids = (parent) => folders.filter((f) => f.parent === parent);
  const subtotal = (f) => f.count + kids(f.id).reduce((n, c) => n + subtotal(c), 0);
  const folderById = (id) => folders.find((f) => f.id === id);
  const T = () => STRINGS[locale] ?? STRINGS.en;
  /** An icon from the sprite at the top of <body>. */
  const ic = (name, cls = "") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  /** A folder's branch colour: the top-level folder it sits under decides it. */
  function folderColor(id) {
    let f = folderById(id);
    while (f?.parent && folderById(f.parent)) f = folderById(f.parent);
    const n = Math.max(0, kids(null).findIndex((x) => x.id === f?.id));
    return `var(--m${(n % 8) + 1})`;
  }
  const catLabel = (id) => catLabels[id]?.[locale] ?? id;

  // Private instances need the token on every request; it stays in this browser only.
  // A link with ?key= (a read-only share key, e.g. from a chat bot or an agent) opens the page
  // without a password: keep the key in this browser, take it out of the address bar.
  (() => {
    const u = new URL(location.href);
    const k = u.searchParams.get("key");
    if (!k) return;
    store.set("driftnet-key", k);
    u.searchParams.delete("key");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  })();

  async function api(path, init = {}) {
    // Reads work with the admin password or the share key; writes go through other helpers with the password.
    const token = store.get("driftnet-token") || store.get("driftnet-key");
    let res = await fetch(path, { ...init, headers: { ...(init.headers ?? {}), ...(token ? { authorization: `Bearer ${token}` } : {}) } });
    // A stored password that no longer works must not hide a share key that does.
    if (res.status === 401 && store.get("driftnet-token") && store.get("driftnet-key") && (init.method ?? "GET") === "GET") {
      store.set("driftnet-token", "");
      res = await fetch(path, { ...init, headers: { ...(init.headers ?? {}), authorization: `Bearer ${store.get("driftnet-key")}` } });
    }
    if (res.status === 401) throw Object.assign(new Error("unauthorized"), { unauthorized: true });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  function askToken(then) {
    // Someone browsing with a share key only needs the password to change things.
    const viewing = !!store.get("driftnet-key") && !store.get("driftnet-token");
    $("nav").innerHTML = "";
    $("list").innerHTML = `<form class="card" id="token-form">
      <p>${esc(viewing ? T().tokenToEdit : T().tokenPrompt)}</p><p class="dlg-error" id="token-err"></p>
      <input id="token" class="search" style="max-width:none;width:100%" type="password" autocomplete="current-password">
      <p><button class="lang" type="submit">${esc(T().tokenSave)}</button>
      ${viewing ? `<button class="lang" type="button" id="token-back">${esc(T().back)}</button>` : ""}</p>
      <p class="hint">${esc(T().st.loginHelp)}</p><p class="hint">${esc(T().st.loginAdvanced.replaceAll("PORT", String(serverPort)))}</p></form>`;
    if (viewing) $("token-back").onclick = () => load();
    $("token-form").onsubmit = async (e) => {
      e.preventDefault();
      const v = $("token").value.trim();
      if (!v) return;
      // Check it before keeping it: the admin password opens the settings, a share key only reads.
      const auth = { authorization: `Bearer ${v}` };
      const read = await fetch("/api/stats", { headers: auth }).catch(() => null);
      if (!read?.ok) { $("token-err").textContent = T().st.keyWrong; return; }
      const admin = await fetch("/api/settings", { headers: auth }).catch(() => null);
      store.set(admin?.ok ? "driftnet-token" : "driftnet-key", v);
      (then ?? load)();
    };
  }

  function applyLocale() {
    document.documentElement.lang = locale;
    document.querySelector(".skip").textContent = locale === "zh-TW" ? "跳到卡片" : "Skip to the cards";
    $("q").placeholder = T().search;
    $("q").setAttribute("aria-label", T().search);
    $("lang").textContent = T().switchTo;
    $("palette-btn").textContent = isMac ? "⌘K" : "Ctrl K";
    $("palette-btn").title = $("palette-btn").ariaLabel = T().palette;
    $("nav").setAttribute("aria-label", T().nav);
    $("menu").setAttribute("aria-label", T().menu);
  }

  // ── Drawer (phones) ──────────────────────────────────────────────────────
  const isDrawer = () => matchMedia("(max-width: 720px)").matches;
  /** keyboard: move focus into the drawer and back (a tap doesn't need the focus ring). */
  function setMenu(open, keyboard = false) {
    document.body.classList.toggle("menu-open", open);
    // Keyboard and screen-reader focus stay inside the drawer while it is open.
    for (const id of ["list", "crumb"]) $(id).inert = open && isDrawer();
    document.querySelector("header").inert = open && isDrawer();
    document.querySelector(".skip").inert = open && isDrawer();
    $("menu").setAttribute("aria-expanded", String(open));
    if (!keyboard) return;
    if (open) $("nav").querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
    else if (isDrawer()) $("menu").focus({ preventScroll: true });
  }
  // event.detail is 0 for a click made with the keyboard (Enter / Space).
  $("menu").onclick = (e) => setMenu(!document.body.classList.contains("menu-open"), e.detail === 0);
  $("crumb").onclick = (e) => setMenu(true, e.detail === 0);
  $("scrim").onclick = () => setMenu(false);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("menu-open")) setMenu(false, true); });

  /** One line under the header saying what is shown, so a closed drawer hides nothing. */
  function updateCrumb() {
    const t = T();
    const parts = [state.view === "favorites" ? t.favorites : state.view === "trash" ? t.trash : state.view === "inbox" ? t.inbox
      : state.view === "notes" ? t.notes : state.view === "map" ? t.map : t.all];
    if (state.category) parts.push(catLabel(state.category));
    if (state.kind) parts.push(t.kinds[state.kind] ?? state.kind);
    $("crumb").innerHTML = `${esc(t.showing)} <b>${esc(parts.join(" · "))}</b>`;
  }

  async function load() {
    const saved = store.get("driftnet-locale");
    if (STRINGS[saved]) locale = saved;
    applyLocale();
    let stats, ui;
    try {
      [stats, ui, folders, notes] = await Promise.all([api("/api/stats"), api("/api/ui"), api("/api/folders"), api("/api/notes")]);
      stats.notes = notes.length;
    } catch (err) {
      if (err.unauthorized) return askToken();
      throw err;
    }
    catLabels = ui.categories;
    role = ui.role ?? "admin";
    serverPort = ui.port ?? 8787;
    summaries = ui.summaries ?? true;
    document.body.classList.toggle("readonly", role !== "admin");
    $("lock").hidden = role === "admin";
    if (ui.setup && !store.get("driftnet-setup-seen")) { store.set("driftnet-setup-seen", "1"); setTimeout(() => openSettings(true), 300); }
    if (!STRINGS[saved] && STRINGS[ui.locale]) locale = ui.locale;
    applyLocale();
    $("stats").textContent = T().stats(stats.items, stats.shares);
    $("lock").innerHTML = `${ic("lock")}<span class="long">${esc(T().st.viewOnly)}</span><span class="short">${esc(T().st.unlockShort)}</span>`;
    const btn = (field, key, label, n, icon) =>
      `<button type="button" data-field="${field}" data-value="${esc(key)}" aria-pressed="${state[field] === key}">
         <span class="lbl">${icon ? ic(icon) : ""}<span>${esc(label)}</span></span><span class="count">${n ?? ""}</span></button>`;
    const footBtn = (attr, icon, label) => `<button type="button" ${attr}><span class="lbl">${ic(icon)}<span>${esc(label)}</span></span></button>`;
    $("nav").innerHTML =
      `<div class="drawer-head"><span class="brand"><img src="/favicon.svg" alt="" width="24" height="24">driftnet</span>` +
      `<button type="button" class="menu" id="menu-close" aria-label="${esc(T().close)}">✕</button></div>` +
      `<div class="row">` +
      (role === "admin" || stats.inbox ? btn("view", "inbox", T().inbox, stats.inbox || "", "inbox") : "") +
      btn("view", "all", T().all, stats.items, "all") + btn("view", "favorites", T().favorites, stats.favorites, "star") +
      btn("view", "map", T().map, "", "map") +
      `<button type="button" class="split-btn" data-split aria-pressed="${split}" title="${esc(T().splitHelp)}"><span class="lbl">${ic("split")}<span>${esc(T().split)}</span></span><span class="count"></span></button>` +
      btn("view", "notes", T().notes, stats.notes || "", "note") +
      btn("view", "trash", T().trash, stats.trash || "", "trash") +
      `</div><div class="folders-head" data-drop-root><h2>${esc(T().folders)}</h2>` +
      (role === "admin" ? `<button type="button" class="icon" data-suggest title="${esc(summaries ? T().planBtn : T().planNoModel)}" aria-label="${esc(T().planBtn)}" ${summaries ? "" : "aria-disabled=\"true\""} ${summaries ? "" : 'style="opacity:.45"'}>${ic("sparkle")}</button>` : "") +
      `<button type="button" class="icon" data-new="" title="${esc(T().newFolder)}" aria-label="${esc(T().newFolder)}">${ic("plus")}</button></div>` +
      `<div class="tree" role="list">${folderRows(null, 0)}</div><h2>${esc(T().kind)}</h2><div class="row kinds">` + btn("kind", "", T().any, "") +
      Object.entries(T().kinds).map(([k, v]) => btn("kind", k, v, "")).join("") + `</div>` +
      `<div class="foot">` +
      (ui.role !== "admin" ? footBtn("data-login", "lock", T().st.login) : "") +
      footBtn("data-connect", "plug", T().st.connect) +
      footBtn("data-settings", "gear", T().settings) +
      footBtn('data-export="markdown"', "download", T().exportMd) +
      footBtn('data-export="vault"', "download", T().exportVault) +
      (ui.role === "admin" && !ui.local && store.get("driftnet-token") ? footBtn("data-logout", "logout", T().st.logout) : "") + `</div>`;
    $("nav").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.id === "menu-close") return setMenu(false);
      if (b.dataset.twist) {
        const id = b.dataset.twist;
        collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
        store.set("driftnet-collapsed", JSON.stringify([...collapsed]));
        return load();
      }
      if (b.dataset.edit) return openFolderDialog(b.dataset.edit);
      if (b.dataset.export) return download(b.dataset.export);
      if (b.dataset.settings !== undefined) { if (isDrawer()) setMenu(false); return openSettings(); }
      if (b.dataset.connect !== undefined) { if (isDrawer()) setMenu(false); return openConnect(); }
      if (b.dataset.login !== undefined) { if (isDrawer()) setMenu(false); return openLogin(); }
      if (b.dataset.logout !== undefined) { store.set("driftnet-token", ""); return load(); }
      if (b.dataset.new !== undefined) return openFolderDialog(null, b.dataset.new || null);
      if (b.dataset.split !== undefined) {
        split = !split;
        store.set("driftnet-split", split ? "1" : "0");
        if (state.view !== "all" && state.view !== "favorites") state.view = "all";
        return load();
      }
      if (b.dataset.suggest !== undefined) { if (isDrawer()) setMenu(false); return openPlan(); }
      const { field, value } = b.dataset;
      if (field === "view" && value === "map" && split) { split = false; store.set("driftnet-split", "0"); }
      // Choosing a category stays inside the current view; choosing a view clears the category.
      if (field === "view") state.category = "";
      // The map has its own folders: picking one in the sidebar shows its cards.
      if (field === "category" && (state.view === "map" || state.view === "notes")) state.view = "all";
      state[field] = field !== "view" && state[field] === value ? "" : value;
      $("nav").querySelectorAll("button[data-field]").forEach((x) => x.setAttribute("aria-pressed", state[x.dataset.field] === x.dataset.value));
      if (isDrawer()) setMenu(false);
      render();
    };
    attachDrops();
    render();
  }

  /** The folder tree, one row per folder: ▸ toggle, name + count (filters), ⋯ (edit). */
  function folderRows(parent, depth) {
    const t = T();
    return kids(parent).map((f) => {
      const hasKids = kids(f.id).length > 0;
      const open = hasKids && !collapsed.has(f.id);
      return `<div class="folder" role="listitem" data-folder="${esc(f.id)}" draggable="true" style="--depth:${depth}">
          <button type="button" class="icon twist ${hasKids ? "" : "leaf"}" ${hasKids ? `data-twist="${esc(f.id)}" aria-expanded="${open}"` : 'tabindex="-1" aria-hidden="true"'}
            aria-label="${esc(t.expand)}">${ic("chev")}</button>
          <button type="button" data-field="category" data-value="${esc(f.id)}" aria-pressed="${state.category === f.id}" title="${esc(f.description)}" style="--c:${folderColor(f.id)}">
            <span class="lbl"><span class="dot ${depth ? "sub" : ""}"></span><span>${esc(catLabel(f.id))}</span></span><span class="count">${subtotal(f) || ""}</span></button>
          <button type="button" class="icon more" data-edit="${esc(f.id)}" title="${esc(t.editFolder)}" aria-label="${esc(t.editFolder)}: ${esc(catLabel(f.id))}">${ic("dots")}</button>
        </div>` + (open ? folderRows(f.id, depth + 1) : "");
    }).join("");
  }

  /** "Path › Name" for a folder, used in the picker and toasts. */
  const folderPath = (id) => { const f = folderById(id); return f?.parent ? `${folderPath(f.parent)} › ${catLabel(id)}` : catLabel(id); };

  // ── Folder dialog: new / rename / describe / move / delete ───────────────
  let editing = null;
  function openFolderDialog(id, parent = null) {
    const t = T();
    const f = id ? folderById(id) : null;
    editing = id;
    $("fd-title").textContent = id ? t.editFolder : parent ? `${t.newSub} ${catLabel(parent)}` : t.newFolder;
    $("fd-name-l").textContent = t.folderName;
    $("fd-desc-l").textContent = t.folderDesc;
    $("fd-parent-l").textContent = t.folderParent;
    $("fd-name").value = f ? catLabel(f.id) : "";
    $("fd-desc").value = f?.description ?? "";
    // A folder can't move inside itself or its own sub-folders.
    const banned = new Set();
    if (id) for (const q = [id]; q.length;) { const x = q.pop(); banned.add(x); q.push(...kids(x).map((k) => k.id)); }
    const opts = (p, depth) => kids(p).filter((k) => !banned.has(k.id))
      .map((k) => `<option value="${esc(k.id)}">${"\u00a0\u00a0".repeat(depth)}${esc(catLabel(k.id))}</option>` + opts(k.id, depth + 1)).join("");
    $("fd-parent").innerHTML = `<option value="">${esc(t.topLevel)}</option>` + opts(null, 0);
    $("fd-parent").value = (f ? f.parent : parent) ?? "";
    const del = $("fd-delete");
    del.hidden = !id || id === "other";
    del.textContent = t.del;
    del.classList.remove("armed");
    const fb = $("fd-focus");
    fb.hidden = !id || state.view !== "map" || id === mapFocus;
    fb.textContent = t.focusFolder;
    $("fd-cancel").textContent = t.cancel;
    $("fd-save").textContent = t.save;
    $("fd-error").textContent = "";
    $("folder-dlg").showModal();
    $("fd-name").focus();
  }
  $("fd-focus").onclick = () => { $("folder-dlg").close(); setMapFocus(editing); };
  $("fd-cancel").onclick = () => $("folder-dlg").close();
  // Delete asks twice inside the dialog (no browser confirm box).
  $("fd-delete").onclick = async () => {
    const del = $("fd-delete");
    if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = T().delSure; return; }
    if (await folderWrite(`/api/folders/${encodeURIComponent(editing)}`, "DELETE")) {
      if (state.category === editing) state.category = "";
      $("folder-dlg").close();
      load();
    }
  };
  $("folder-form").onsubmit = async (e) => {
    e.preventDefault();
    const f = editing ? folderById(editing) : null;
    const name = $("fd-name").value.trim();
    const body = { description: $("fd-desc").value.trim(), parent: $("fd-parent").value || null };
    // Built-in folders keep their translated label until the reader renames them.
    if (!f || name !== catLabel(f.id)) body.name = name;
    const ok = editing
      ? await folderWrite(`/api/folders/${encodeURIComponent(editing)}`, "PATCH", body)
      : await folderWrite("/api/folders", "POST", body);
    if (ok) { $("folder-dlg").close(); load(); }
  };
  /** Write to the folder API; a refusal (empty name, a loop) shows in the dialog. */
  async function folderWrite(path, method, body) {
    const token = store.get("driftnet-token");
    try {
      const res = await fetch(path, { method, headers: { "content-type": "application/json", ...(token ? { authorization: `Bearer ${token}` } : {}) },
                                      ...(body ? { body: JSON.stringify(body) } : {}) });
      if (res.status === 401) { needAdmin(); return null; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { $("fd-error").textContent = friendlyError(data.error) ?? T().failed; return null; }
      return data;
    } catch {
      $("fd-error").textContent = T().failed;
      return null;
    }
  }

  // ── Move a card: picker (phones) or drag onto the sidebar (desktop) ───────
  let moving = null, movingMany = null;
  /** The nine folders cards were filed into most often (the server counts moves and undoes), in tree order on a tie: keys 1–9 file a card there. */
  function quickFolders() {
    const order = []; (function walk(p) { for (const f of kids(p)) { order.push(f.id); walk(f.id); } })(null);
    return order.map((id, at) => ({ id, at, n: folders.find((f) => f.id === id)?.uses ?? 0 })).filter((f) => f.n > 0)
      .sort((a, b) => b.n - a.n || a.at - b.at).slice(0, 9).map((f) => f.id);
  }
  /** Mirror the server's counter on the folders already loaded, so keys 1–9 stay current without a refetch. */

  // <fuzzy>
  /**
   * Rank entries against a query (empty query = all, in order). Tiers: exact, prefix, word start, substring, letters in order
   * (3+ characters, first field only); text in later fields counts a bit less. Only matches come back, best first.
   */
  function fuzzyRank(query, entries, fields) {
    const q = query.trim().toLowerCase();
    if (!q) return [...entries];
    const inOrder = (f) => { let at = 0; for (const ch of f) if (ch === q[at] && ++at === q.length) return true; return false; };
    const scored = [];
    entries.forEach((e, at) => {
      let best = null;
      fields(e).forEach((raw, i) => {
        const f = String(raw ?? "").toLowerCase();
        if (!f) return;
        let tier = null;
        if (f === q) tier = -1;
        else if (f.startsWith(q)) tier = 0;
        else if (f.split(/[\s\-_/›.,:]+/).some((w) => w.startsWith(q))) tier = 1;
        else if (f.includes(q)) tier = 2;
        else if (i === 0 && q.length >= 3 && inOrder(f)) tier = 4;
        if (tier === null) return;
        const score = tier + (i > 0 ? 3 : 0);
        if (best === null || score < best) best = score;
      });
      if (best !== null) scored.push({ e, best, at });
    });
    return scored.sort((a, b) => a.best - b.best || a.at - b.at).map((x) => x.e);

  async function moveItem(id, to, quiet = false) {

    const res = await fetch(`/api/items/${id}/move`, { method: "POST", body: JSON.stringify({ folder: to }),
      headers: { "content-type": "application/json", ...(token ? { authorization: `Bearer ${token}` } : {}) } }).catch(() => null);
    if (res?.status === 401) return needAdmin();
    if (!res?.ok) return toast(T().failed);
    item.category = to;
    const f = folderById(to); if (f) f.count++;
    const old = folderById(from); if (old) old.count--;
    const el = document.getElementById(`item-${id}`);
    // Still inside the folder being viewed? Update the badge; otherwise it leaves the list.
    const visible = state.view !== "inbox" && (!state.category || subtreeOf(state.category).has(to));
    if (el && !visible) {

    const onMap = mapItems.find((x) => x.id === id);

    if (mapShown()) drawMap();
    bumpUse(to);
    if (!quiet) { toast(T().moved(nameOf(item), folderPath(to)), async () => { await moveItem(id, from, true); render(); }); }
  }

  /** Root → folders → sub-folders and cards, laid out left to right like XMind. */

        hasKids: kids(f.id).length > 0 || cards.length > 0, hit: q && f.id && catLabel(f.id).toLowerCase().includes(q) };

  /** A small, escape-first Markdown: headings, lists, quotes, code, bold, italics, links, and #12 → card 12. */
  function md(src) {
    const inline = (s) => esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, text, href) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`)
      .replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (m, pre, href) => `${pre}<a href="${href}" target="_blank" rel="noopener noreferrer">${href}</a>`)
      .replace(/(^|[^\w&;/])#(\d+)\b/g, (m, pre, id) => `${pre}<a href="#item-${id}" data-card="${id}">#${id}</a>`);
    const out = [];
    let list = false, code = null;
    for (const line of String(src ?? "").split("\n")) {
      if (code !== null) {
        if (/^```/.test(line)) { out.push(`<pre><code>${esc(code)}</code></pre>`); code = null; } else code += (code ? "\n" : "") + line;
        continue;
      }
      if (/^```/.test(line)) { code = ""; continue; }
      const item = /^\s*[-*]\s+(.*)/.exec(line);
      if (item) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(item[1])}</li>`); continue; }
      if (list) { out.push("</ul>"); list = false; }
      const h = /^(#{1,3})\s+(.*)/.exec(line);
      if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
      else if (/^>\s?/.test(line)) out.push(`<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`);
      else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
    if (list) out.push("</ul>");
    if (code !== null) out.push(`<pre><code>${esc(code)}</code></pre>`);
    return out.join("");
  }

  for (const d of document.querySelectorAll("dialog")) d.addEventListener("close", () => setTimeout(restoreFocus, 0));
  // ── Commands and the palette (⌘K / Ctrl+K) ────────────────────────────────
  /** Everything the palette can run. keys (two keys = "g" then …) and help (a STRINGS key) also feed the ? dialog. */
  function showLayout(kind) {
    split = kind === "split";
    store.set("driftnet-split", split ? "1" : "0");
    Object.assign(state, { view: kind === "map" ? "map" : "all", category: "" });
    load();
  }
  function toggleDark() {
    const dark = document.documentElement.dataset.theme === "dark" || (prefs.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    prefs.theme = dark ? "light" : "dark";
    store.set("driftnet-prefs", JSON.stringify(prefs));
    applyPrefs();
  }
  const commands = [
    { id: "view-list", label: { en: "Show the card list", "zh-TW": "顯示卡片列表" }, keys: ["g", "a"], help: "kAll", run: () => showLayout("list") },
    { id: "view-map", label: { en: "Show the mind map", "zh-TW": "顯示樹狀圖" }, keys: ["g", "m"], help: "kMap", run: () => showLayout("map") },
    { id: "view-split", label: { en: "Show cards and mind map side by side", "zh-TW": "並排顯示卡片與樹狀圖" }, when: () => wideQuery.matches, run: () => showLayout("split") },
    { id: "move", label: { en: "Move the focused card…", "zh-TW": "移動目前選取的卡片…" }, when: () => role === "admin" && !!pal.focused, run: () => openMovePicker(pal.focused) },
    { id: "new-folder", label: { en: "New folder", "zh-TW": "新增資料夾" }, when: () => role === "admin", run: () => openFolderDialog(null, null) },
    { id: "export-md", label: { en: "Download a backup (Markdown)", "zh-TW": "下載備份（Markdown）" }, run: () => download("markdown") },
    { id: "export-vault", label: { en: "Download for Obsidian / Notion", "zh-TW": "下載給 Obsidian／Notion" }, run: () => download("vault") },
    { id: "settings", label: { en: "Settings", "zh-TW": "設定" }, run: () => openSettings() },
    { id: "dark", label: { en: "Toggle dark mode", "zh-TW": "切換深色模式" }, run: toggleDark },
    { id: "language", label: { en: "Switch language", "zh-TW": "切換語言" }, run: () => $("lang").click() },
    { id: "keys", label: { en: "Keyboard shortcuts", "zh-TW": "快捷鍵" }, keys: ["?"], help: "kHelp", run: () => openKeys() },
  ];
  const cmdLabel = (c) => c.label[locale] ?? c.label.en;
  const goFolder = (id) => { Object.assign(state, { view: "all", category: id, kind: "" }); load(); };
  const pal = { rows: [], at: 0, gen: 0, timer: 0, cards: [], focused: null };
  function paletteRows(q) {
    const rows = [];
    const fl = q ? fuzzyRank(q, folders, (f) => folderFields(f.id)) : quickFolders().map(folderById).filter(Boolean);
    for (const f of fl.slice(0, q ? 6 : 5)) rows.push({ group: "folders", label: catLabel(f.id), sub: folderPath(f.id) === catLabel(f.id) ? "" : folderPath(f.id), color: folderColor(f.id), run: () => goFolder(f.id) });
    if (q) for (const i of pal.cards) rows.push({ group: "cards", label: nameOf(i), sub: folderPath(i.category), run: () => { extraItems.set(i.id, i); openPeek(i.id); } });
    const avail = commands.filter((c) => !c.when || c.when());
    for (const c of fuzzyRank(q, avail, (c) => [cmdLabel(c), c.id]).slice(0, q ? 8 : 20))
      rows.push({ group: "commands", label: cmdLabel(c), sub: c.keys?.join(" ") ?? "", run: c.run });
    return rows;
  }
  function renderPalette() {
    const t = T(), input = $("cmd-input");
    pal.rows = paletteRows(input.value);
    pal.at = Math.min(pal.at, Math.max(0, pal.rows.length - 1));
    let html = "", last = "";
    pal.rows.forEach((r, i) => {
      if (r.group !== last) { last = r.group; html += `<div class="cmd-h" role="presentation">${esc(t.palGroups[r.group])}</div>`; }
      html += `<div class="cmd-o" role="option" id="cmd-o-${i}" data-i="${i}" aria-selected="${i === pal.at}"><span class="lab" ${r.color ? `style="--c:${r.color}"` : ""}>${esc(r.label)}</span>` +
        (r.sub ? `<span class="sub">${esc(r.sub)}</span>` : "") + `</div>`;
    });
    $("cmd-list").innerHTML = html || `<div class="cmd-empty" role="presentation">${esc(t.palNone)}</div>`;
    if (pal.rows.length) input.setAttribute("aria-activedescendant", `cmd-o-${pal.at}`); else input.removeAttribute("aria-activedescendant");
    $("cmd-o-" + pal.at)?.scrollIntoView({ block: "nearest" });
  }
  function openPalette() {
    if (document.querySelector("dialog[open]")) return;
    const t = T();
    pal.focused = focusedId();
    pal.at = 0; pal.cards = []; pal.gen++;
    $("cmd-input").value = "";
    $("cmd-input").placeholder = t.palPlaceholder;
    $("cmd-input").setAttribute("aria-label", t.palette);
    $("cmd-list").setAttribute("aria-label", t.palette);
    renderPalette();
    $("cmd-dlg").showModal();
    $("cmd-input").focus();
  }
  function runPalette(i) {
    const r = pal.rows[i];
    if (!r) return;
    $("cmd-dlg").close();
    setTimeout(r.run, 0);   // after the dialog has let go of focus
  }
  $("cmd-input").addEventListener("input", () => {
    const q = $("cmd-input").value.trim(), gen = ++pal.gen;
    pal.at = 0;
    clearTimeout(pal.timer);
    if (q.length < 2) pal.cards = [];
    else pal.timer = setTimeout(async () => {
      const found = await api(`/api/items?${new URLSearchParams({ q, limit: "6" })}`).catch(() => []);
      if (gen !== pal.gen) return;
      pal.cards = found;
      renderPalette();
    }, 150);
    renderPalette();
  });
  $("cmd-input").addEventListener("keydown", (e) => {
    const n = pal.rows.length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (n) { pal.at = (pal.at + (e.key === "ArrowDown" ? 1 : n - 1)) % n; renderPalette(); }
    } else if (e.key === "Enter") { e.preventDefault(); runPalette(pal.at); }
  });
  $("cmd-list").addEventListener("click", (e) => { const o = e.target.closest("[data-i]"); if (o) runPalette(Number(o.dataset.i)); });
  $("cmd-list").addEventListener("pointermove", (e) => {
    const o = e.target.closest("[data-i]");
    if (!o || Number(o.dataset.i) === pal.at) return;
    $("cmd-o-" + pal.at)?.setAttribute("aria-selected", "false");
    pal.at = Number(o.dataset.i);
    o.setAttribute("aria-selected", "true");
    $("cmd-input").setAttribute("aria-activedescendant", o.id);
  });
  $("cmd-dlg").addEventListener("click", (e) => { if (e.target === $("cmd-dlg")) $("cmd-dlg").close(); });
  $("cmd-dlg").addEventListener("close", () => { clearTimeout(pal.timer); pal.gen++; });
  $("palette-btn").onclick = openPalette;
  addEventListener("keydown", (e) => {
    if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey || e.key.toLowerCase() !== "k") return;
    e.preventDefault();
    if ($("cmd-dlg").open) $("cmd-dlg").close(); else openPalette();
  });
  /** The ? dialog: every shortcut, and which folder each number key files into. */
  function openKeys() {
    const t = T(), quick = quickFolders();
    const row = (keys, text) => `<dt>${keys.map((k) => `<kbd>${esc(k)}</kbd>`).join(" ")}</dt><dd>${esc(text)}</dd>`;
    $("ky-title").textContent = t.keysTitle;
    $("ky-close").textContent = t.keysClose;
    $("ky-body").innerHTML =
      `<h4>${esc(t.keysMove)}</h4>` + row(["j", "k"], t.kNext) + row(["f"], t.kFav) + row(["m"], t.kMove) + row(["n"], t.kNote) + row(["#"], t.kTrash) +
      `<h4>${esc(t.keysInbox)}</h4>` + row(["1", "2", "3"], t.kChip) + row(["s"], t.kSkip) + row(["m"], t.kMove) +
      `<h4>${esc(t.keysSelect)}</h4>` + row(["x"], t.kSelect) + row(["Shift", "click"], t.kRange) + row([t.kHold], t.kLong) + row(["Esc"], t.kClear) +
      `<h4>${esc(t.keysQuick)}</h4>` + (quick.length ? quick.map((id, i) => row([String(i + 1)], t.kQuickN(catLabel(id)))).join("") : `<dd style="grid-column:1/-1">${esc(t.kQuickNone)}</dd>`) +
      `<dd style="grid-column:1/-1">${esc(t.kQuickInbox)}</dd>` +
      `<h4>${esc(t.keysGo)}</h4>` + row([isMac ? "⌘" : "Ctrl", "K"], t.kPalette) + row(["/"], t.kSearch) +
      commands.filter((c) => c.keys).map((c) => row(c.keys, t[c.help])).join("") + row(["z"], t.kUndo) +
      `<h4>${esc(t.keysMap)}</h4>` + row(["↓", "↑"], t.kTreeNav) + row(["→"], t.kTreeOpen) + row(["←"], t.kTreeClose) + row(["Home", "End"], t.kTreeEnds) +
      row([t.kTreeType], t.kTreeTypeText) + row(["z"], t.kFocus) + row(["Esc", "Backspace"], t.kFocusUp);
    $("keys-dlg").showModal();
  }
  $("ky-close").onclick = () => $("keys-dlg").close();
  $("keys-dlg").addEventListener("click", (e) => { if (e.target === $("keys-dlg")) $("keys-dlg").close(); });
  // ── AI folder plan: proposed, reviewed line by line, applied in one go ────
  let plan = null;
  const planOps = () => plan?.operations ?? [];
  /** A folder named in a plan: a real one by path, or one the plan itself creates (new:<ref>). */
  function planFolder(id) {
    if (!id.startsWith("new:")) return folderPath(id);
    const c = planOps().find((o) => o.op === "create" && o.ref === id.slice(4));
    return c ? (c.parent ? `${planFolder(c.parent)} › ${c.name}` : c.name) : id;
  }
  const planNeeds = (o) => o.op === "move" ? o.folder : o.op === "create" && o.parent ? o.parent : "";
  function planLine(o) {
    const t = T();
    return o.op === "create" ? t.planCreate(planFolder("new:" + o.ref))
      : o.op === "rename" ? t.planRename(folderPath(o.folder), o.name)
      : o.op === "move" ? t.planMove(o.cards.length, planFolder(o.folder))
      : t.planMerge(folderPath(o.from), folderPath(o.into));
  }
  function drawPlan() {
    const t = T();
    $("plan-body").innerHTML = planOps().length ? planOps().map((o) => `<div class="plan-op" data-op="${esc(o.id)}">
        <input type="checkbox" id="po-${esc(o.id)}" checked aria-labelledby="pol-${esc(o.id)}">
        <label id="pol-${esc(o.id)}" for="po-${esc(o.id)}"><b>${esc(planLine(o))}</b></label>
        ${o.reason ? `<span class="why">${esc(o.reason)}</span>` : ""}
        ${o.op === "move" ? `<details><summary>${esc(t.planMove(o.cards.length, planFolder(o.folder)))}</summary><ul>${o.cards.map((c) => `<li>${esc(c.name)}</li>`).join("")}</ul></details>` : ""}
      </div>`).join("") : `<p class="hint">${esc(t.planNone)}</p>`;
    syncPlan();
  }
  /** An operation that points at a folder the plan creates goes with it: untick the create and those untick (and stay locked). */
  function syncPlan() {
    const on = (id) => $(`po-${id}`)?.checked;
    const refOn = (ref) => { const c = planOps().find((o) => o.op === "create" && o.ref === ref); return c ? on(c.id) && refOn(planNeeds(c).replace(/^new:/, "")) : true; };
    for (const o of planOps()) {
      const need = planNeeds(o), ok = !need.startsWith("new:") || refOn(need.slice(4));
      const box = $(`po-${o.id}`);
      if (!ok) box.checked = false;
      box.disabled = !ok;
      box.closest(".plan-op").classList.toggle("off", !box.checked);
      box.title = ok ? "" : T().planNeeds;
    }
    const n = planOps().filter((o) => on(o.id)).length;
    $("pl-apply").textContent = T().planApply(n);
    $("pl-apply").disabled = !n;
  }
  $("plan-body").addEventListener("change", syncPlan);
  async function openPlan() {
    const t = T();
    if (!summaries) return toast(t.planNoModel);
    plan = null;
    $("pl-title").textContent = t.planTitle;
    $("pl-intro").textContent = t.planIntro;
    $("pl-cancel").textContent = t.cancel;
    $("pl-apply").textContent = t.planApply(0);
    $("pl-apply").disabled = true;
    $("plan-body").innerHTML = `<p class="hint" role="status">${esc(t.planThinking)}</p>`;
    $("plan-dlg").showModal();
    const r = await mapWrite("/api/folders/suggest", "POST");
    if (!r) return $("plan-dlg").close();
    plan = r;
    drawPlan();
  }
  $("pl-cancel").onclick = () => $("plan-dlg").close();
  $("plan-dlg").addEventListener("click", (e) => { if (e.target === $("plan-dlg")) $("plan-dlg").close(); });
  $("pl-apply").onclick = async () => {
    const accept = planOps().filter((o) => $(`po-${o.id}`)?.checked).map((o) => o.id);
    if (!accept.length) return;
    $("pl-apply").disabled = true;
    const r = await mapWrite("/api/folders/suggest/apply", "POST", { plan: plan.plan, accept });
    if (!r) { $("pl-apply").disabled = false; return; }
    $("plan-dlg").close();
    await load();
    toast(T().planApplied(r.count), async () => {
      if (await mapWrite("/api/items/bulk/undo", "POST", { undo: r.undo })) await load();
    });
  };

  /** The newest undoable action, so z (or ⌘/Ctrl+Z) can undo it from the keyboard. */
  let lastUndo = null;
  function toast(text, undo) {
    $("toast-text").textContent = text;
    const u = $("toast-undo");
    u.hidden = !undo;
    u.textContent = T().undo;
    lastUndo = undo ?? null;
    u.onclick = async () => { clearTimeout(toastTimer); $("toast").classList.remove("show"); lastUndo = null; await undo?.(); };
    $("toast").classList.add("show");
    toastMs = Math.min(9000, 4500 + text.length * 45);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, toastMs);
  }
  // Once the toast is gone, z no longer undoes something you can't see any more.
  function hideToast() { $("toast").classList.remove("show"); lastUndo = null; }
  /** z undoes only what the toast still shows. */
  const canUndo = () => !!lastUndo && $("toast").classList.contains("show");
  let toastMs = 5000;
  // Reading or reaching for Undo keeps the toast up.
  for (const ev of ["pointerenter", "focusin"]) $("toast").addEventListener(ev, () => clearTimeout(toastTimer));
  for (const ev of ["pointerleave", "focusout"]) $("toast").addEventListener(ev, () => {
    clearTimeout(toastTimer);
    if ($("toast").classList.contains("show")) toastTimer = setTimeout(hideToast, 2500);
  });

  // ── Keyboard: j/k to step through cards, then act on the focused one ─────
  let lastKey = "";
  addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "z" && canUndo() && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName ?? "")) { e.preventDefault(); $("toast-undo").click(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector("dialog[open]")) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? "")) return;
    const k = e.key, prev = lastKey;
    lastKey = k;
    if (k === "Escape" && selected.size) { clearSelection(); return; }
    if ((k === "Escape" || k === "Backspace") && mapShown() && mapFocus && !picked && !document.body.classList.contains("menu-open")) { e.preventDefault(); mapUp(); return; }
    if (k === "/") { e.preventDefault(); $("q").focus(); return; }
    if ((k === "z" || k === "u") && canUndo()) { e.preventDefault(); $("toast-undo").click(); return; }
    if (k === "?") { openKeys(); return; }
    // Inbox: 1–3 pick the focused card's suggestion chips (before the global "file into top-9 folders").
    if (state.view === "inbox" && /^[1-3]$/.test(k) && role === "admin" && focusedId() && !selected.size) {
      const chip = document.querySelectorAll(`#item-${focusedId()} [data-chip]`)[Number(k) - 1];
      if (chip) { e.preventDefault(); inboxFile(focusedId(), chip.dataset.chip); return; }
    }
    if (/^[1-9]$/.test(k) && role === "admin" && !document.activeElement?.isContentEditable && quickMove(Number(k))) { e.preventDefault(); return; }
    if (k === "x" && role === "admin" && !document.activeElement?.isContentEditable && focusedId() && state.view !== "map") { e.preventDefault(); toggleSelect(focusedId()); return; }
    const chord = commands.find((c) => c.keys?.length === 2 && c.keys[0] === prev && c.keys[1] === k);
    if (chord) { chord.run(); return; }
    const cards = [...$("list").querySelectorAll(".swipe .card")];
    if (!cards.length) return;
    const cur = document.activeElement?.closest?.(".card");
    const at = cards.indexOf(cur);
    if (k === "j" || k === "k" || (k === "s" && state.view === "inbox")) {
      e.preventDefault();
      const next = cards[Math.min(cards.length - 1, Math.max(0, at + (k === "k" ? -1 : 1)))] ?? cards[0];
      next.focus(); next.scrollIntoView({ block: "nearest" });
      return;
    }
    if (!cur || role !== "admin") return;
    const swipe = cur.closest(".swipe");
    if (!["f", "#", "Delete", "m", "n"].includes(k)) return;
    e.preventDefault();   // or the letter lands in the dialog that opens
    if (k === "f") run(swipe, "favorite");
    else if (k === "#" || k === "Delete") run(swipe, state.view === "trash" ? "restore" : "trash");
    else if (k === "m") openMovePicker(Number(swipe.dataset.id));
    else if (k === "n") openItemNote(Number(swipe.dataset.id));
  });

  $("lang").onclick = () => {
    locale = locale === "en" ? "zh-TW" : "en";
    store.set("driftnet-locale", locale);
    load();
  };
  let timer;
  if (location.hash.startsWith("#focus=")) { mapFocus = focusFromHash(); state.view = "map"; }
  $("q").oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 200); };
  // A scanned pairing link (#pair=<code>): take the code out of the address bar at once, swap it for this device's token.
  async function claimPairing() {
    const m = /^#pair=([\w-]{16,128})$/.exec(location.hash);
    if (!m) return;
    history.replaceState(null, "", location.pathname + location.search);
    const res = await fetch("/api/pair/claim", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: m[1] }) }).catch(() => null);
    if (!res?.ok) { toast(T().st.pairFailed); return; }
    const dev = await res.json();
    // A write token works like the password everywhere the page uses it, a read token like the share key.
    store.set(dev.scope === "write" ? "driftnet-token" : "driftnet-key", dev.token);
    store.set(dev.scope === "write" ? "driftnet-key" : "driftnet-token", "");
    toast(T().st.pairOk);
  }
  claimPairing().finally(load);
</script>
</body>
</html>
