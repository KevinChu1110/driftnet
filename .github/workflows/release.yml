name: Release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) and this
# publishes everywhere without passwords or one-time codes:
#   npm           trusted publishing: GitHub proves the package was built here
#   MCP Registry  GitHub OIDC login
#   GitHub        a release with notes (Glama rebuilds from it on its own)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC for npm trusted publishing and the MCP Registry

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24   # npm 11.5+ for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag matches the version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but package is $version"; exit 1; }
          grep -q "\"version\": \"$version\"" server.json || { echo "server.json is not at $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:npm

      - name: Publish to npm
        working-directory: dist/npm
        # Already on npm (published by hand)? Then only the steps below run.
        run: |
          if [ "$(npm view driftnet@$VERSION version 2>/dev/null)" = "$VERSION" ]; then
            echo "driftnet@$VERSION is already on npm"
          else
            npm publish --provenance --access public
          fi

      - name: Wait until npm serves it
        run: |
          for i in $(seq 1 60); do
            [ "$(npm view driftnet@$VERSION version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 10
          done
          echo "npm never served $VERSION"; exit 1

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "driftnet $VERSION" --generate-notes --latest
