name: Desktop App

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
          - platform: macos-13
            args: --target x86_64-apple-darwin
            triple: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ""
            triple: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - run: pnpm install --frozen-lockfile

      - name: Build standalone driftnet Node SEA sidecar
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.triple }}
        run: node scripts/build-desktop-sidecar.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "driftnet Desktop ${{ github.ref_name }}"
          releaseBody: "One-click desktop installers for macOS, Windows and Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
